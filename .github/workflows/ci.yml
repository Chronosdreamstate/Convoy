name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: apps/api/node_modules
          key: api-${{ runner.os }}-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: api-${{ runner.os }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules
          key: mobile-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: mobile-${{ runner.os }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
